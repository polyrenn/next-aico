openapi: 3.0.0
info:
  title: Next.js API
  version: 1.0.0
components:
  schemas:
    Company:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        name:
          type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        staff:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
    Branch:
      type: object
      properties:
        id:
          type: integer
        branchId:
          type: integer
        name:
          type:
            - string
            - 'null'
        address:
          type: string
        company:
          $ref: '#/components/schemas/Company'
        currentTank:
          type:
            - string
            - 'null'
        customers:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Prices'
        sales:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
        tanks:
          type: array
          items:
            $ref: '#/components/schemas/Tank'
        crbs:
          type: array
          items:
            $ref: '#/components/schemas/Crb'
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/Stock'
        staffs:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
        declined:
          type: array
          items:
            $ref: '#/components/schemas/DeclinedSales'
        queue:
          type: array
          items:
            $ref: '#/components/schemas/Queue'
        switchLog:
          type: array
          items:
            $ref: '#/components/schemas/SwitchLog'
    Post:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type:
            - string
            - 'null'
        published:
          type: boolean
          default: false
        author:
          anyOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        posts:
          type: array
          items:
            $ref: '#/components/schemas/Post'
    Prices:
      type: object
      properties:
        id:
          type: integer
        branch:
          $ref: '#/components/schemas/Branch'
        category:
          type: string
        pricePerKg:
          type: integer
        availableKgs:
          type: array
          items:
            type: number
    Customer:
      type: object
      properties:
        id:
          type: integer
        uniqueId:
          type: string
        name:
          type: string
        phone:
          type: string
        customerType:
          type:
            - string
            - 'null'
        date:
          type: string
          format: date-time
        branch:
          $ref: '#/components/schemas/Branch'
        change:
          type: integer
          default: 0
        purchaseCount:
          type: integer
          default: 0
    Crb:
      type: object
      properties:
        id:
          type: integer
        branch:
          $ref: '#/components/schemas/Branch'
        crbNumber:
          type: integer
          default: 0
        customerId:
          type:
            - string
            - 'null'
        description:
          type:
            - number
            - string
            - boolean
            - object
            - array
            - 'null'
        amount:
          type: integer
        totalKg:
          type: number
          default: 0
        category:
          type: string
        timestamp:
          type: string
          format: date-time
        date:
          type:
            - string
            - 'null'
          format: date-time
    Queue:
      type: object
      properties:
        id:
          type: integer
        branch:
          $ref: '#/components/schemas/Branch'
        crbNumber:
          type: integer
        customerId:
          type:
            - string
            - 'null'
        description:
          type:
            - number
            - string
            - boolean
            - object
            - array
            - 'null'
        amount:
          type: integer
        totalKg:
          type: number
          default: 0
        category:
          type: string
        timestamp:
          type: string
          format: date-time
        date:
          type:
            - string
            - 'null'
          format: date-time
    Sale:
      type: object
      properties:
        id:
          type: integer
        branch:
          $ref: '#/components/schemas/Branch'
        saleNumber:
          type: integer
          default: 3
        totalKg:
          type: number
          default: 0
        amount:
          type: integer
        category:
          type: string
        timestamp:
          type: string
          format: date-time
        date:
          type:
            - string
            - 'null'
          format: date-time
        customerId:
          type: string
        description:
          type:
            - number
            - string
            - boolean
            - object
            - array
            - 'null'
        narrative:
          type: string
        paymentMethod:
          type: string
        change:
          type: number
        currentTank:
          type: string
        opening:
          type: number
        balance:
          type: number
        closing:
          type: number
    Tank:
      type: object
      properties:
        id:
          type: integer
        tankId:
          type: string
        branch:
          $ref: '#/components/schemas/Branch'
        designation:
          type: string
        amount:
          type: number
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/Stock'
    Stock:
      type: object
      properties:
        id:
          type: integer
        branch:
          $ref: '#/components/schemas/Branch'
        loadNumber:
          type: integer
        tank:
          $ref: '#/components/schemas/Tank'
        date:
          type: string
          format: date-time
        kg:
          type: number
        value:
          type: number
    Staff:
      type: object
      properties:
        id:
          type: integer
        company:
          $ref: '#/components/schemas/Company'
        branch:
          $ref: '#/components/schemas/Branch'
        username:
          type: string
        password:
          type: string
        role:
          type: string
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    DeclinedSales:
      type: object
      properties:
        id:
          type: integer
        branch:
          $ref: '#/components/schemas/Branch'
        saleNumber:
          type: integer
          default: 3
        totalKg:
          type: integer
          default: 0
        amount:
          type: integer
        category:
          type: string
        timestamp:
          type: string
          format: date-time
        customerId:
          type: string
        description:
          type:
            - number
            - string
            - boolean
            - object
            - array
            - 'null'
        declineReason:
          type: string
    SwitchLog:
      type: object
      properties:
        id:
          type: integer
        branch:
          $ref: '#/components/schemas/Branch'
        meta:
          type:
            - number
            - string
            - boolean
            - object
            - array
            - 'null'
        timestamp:
          type: string
          format: date-time
    Session:
      type: object
      properties:
        id:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/Staff'
paths:
  /api/Common/BranchDetails:
    get:
      summary: Returns details for a given branch
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: Details for the given branch
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  current_tank:
                    type: string
                  desig:
                    type: string
                  balance_stock:
                    type: number
                  other_tank:
                    type: string
                  other_desig:
                    type: string
                  company_name:
                    type: string
  /api/Common/CreateBranch:
    post:
      summary: Creates a new branch
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Branch'
      responses:
        '200':
          description: The created branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
  /api/Common/CreateCompany:
    post:
      summary: Creates a new company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Company'
      responses:
        '200':
          description: The created company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
  /api/Common/DayStats:
    get:
      summary: Returns daily statistics for a given branch and date
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
          required: true
          description: The date to retrieve the statistics for
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: Daily statistics for the given branch and date
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    current_tank:
                      type: string
                    load_number:
                      type: integer
                    sales_count:
                      type: integer
                    desig:
                      type: string
                    opening_stock:
                      type: number
                    current_desig:
                      type: string
                    closing_stock:
                      type: number
                    balance_stock:
                      type: number
                    total_kg:
                      type: number
                    company_name:
                      type: string
  /api/Common/DeleteBranch:
    delete:
      summary: Deletes a branch
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the branch to delete
      responses:
        '200':
          description: The deleted branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
  /api/Common/DeleteCompany:
    delete:
      summary: Deletes a company
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the company to delete
      responses:
        '200':
          description: The deleted company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
  /api/Common/EditBranch:
    put:
      summary: Updates a branch
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the branch to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Branch'
      responses:
        '200':
          description: The updated branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
  /api/Common/GetBranches:
    get:
      summary: Returns a list of branches
      responses:
        '200':
          description: A list of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
  /api/Common/GetCompanies:
    get:
      summary: Returns a list of companies
      responses:
        '200':
          description: A list of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
  /api/Common/login-mobile:
    post:
      summary: Logs a user in from a mobile device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: The logged in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '401':
          description: Unauthorized
        '500':
          description: Failed to load data
  /api/Common/Login:
    post:
      summary: Logs a user in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: The logged in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '401':
          description: Unauthorized
        '500':
          description: Failed to load data
  /api/Common/Logout:
    get:
      summary: Logs the user out
      responses:
        '200':
          description: A message indicating that the user has been logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged Out
  /api/Common/next-crb-number:
    get:
      summary: Returns the next CRB number for a given branch
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: The next CRB number
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextCrbNumber:
                    type: integer
  /api/Common/Stats:
    get:
      summary: Returns statistics for a given branch
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: Statistics for the given branch
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    current_tank:
                      type: string
                    tank_name:
                      type: string
                    sales_count:
                      type: integer
                    desig:
                      type: string
                    opening_stock:
                      type: number
                    balance_stock:
                      type: number
                    total_kg:
                      type: number
                    company_name:
                      type: string
  /api/Common/SwitchLog:
    get:
      summary: Returns the switch log for a given branch and date
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
          required: true
          description: The date to retrieve the switch log for
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: The switch log for the given branch and date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SwitchLog'
  /api/Customer/create-customer-mobile:
    post:
      summary: Creates a new customer from a mobile device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: The created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /api/Customer/CreateCustomer:
    post:
      summary: Creates a new customer
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: The created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /api/Customer/GetCustomers:
    get:
      summary: Returns a list of customers
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: A list of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
  /api/Customer/GetRawCustomers:
    get:
      summary: Returns a list of raw customers
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: A list of raw customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
  /api/Customer/GetSingleCustomer:
    get:
      summary: Returns a single customer
      parameters:
        - in: query
          name: uniqueid
          schema:
            type: string
          required: true
          description: The unique ID of the customer to retrieve
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /api/Customer/IsRegistered:
    get:
      summary: Checks if a customer is registered
      parameters:
        - in: query
          name: id
          schema:
            type: string
          required: true
          description: The unique ID of the customer to check
      responses:
        '200':
          description: The customer if they are registered, otherwise null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /api/Customer/search-mobile:
    get:
      summary: Searches for customers on a mobile device
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
        - in: query
          name: searchTerm
          schema:
            type: string
          description: The term to search for
        - in: query
          name: cursor
          schema:
            type: string
          description: The cursor for pagination
        - in: query
          name: limit
          schema:
            type: integer
          description: The number of results to return
      responses:
        '200':
          description: A list of customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  nextCursor:
                    type: string
                  hasNextPage:
                    type: boolean
  /api/FrontDesk/InsertSale:
    post:
      summary: Inserts a new sale
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: The ID of the sale
        - in: query
          name: isreg
          schema:
            type: boolean
          description: Whether the customer is registered
        - in: query
          name: change
          schema:
            type: integer
          description: The amount of change to give the customer
        - in: query
          name: ischange
          schema:
            type: boolean
          description: Whether to update the customer's change
        - in: query
          name: usechange
          schema:
            type: boolean
          description: Whether to use the customer's change
        - in: query
          name: tank
          schema:
            type: string
          description: The ID of the tank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sale'
      responses:
        '200':
          description: The created sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
  /api/Prices/DeleteCategory:
    delete:
      summary: Deletes a price category
      parameters:
        - in: query
          name: category
          schema:
            type: string
          required: true
          description: The name of the category to delete
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: The deleted price category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prices'
  /api/Prices/GetCategories:
    get:
      summary: Returns a list of price categories for a branch
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: A list of price categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prices'
  /api/Prices/GetPriceList:
    get:
      summary: Returns the price list for a branch
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: The price list for the branch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prices'
  /api/Prices/NewCategory:
    post:
      summary: Creates a new price category
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prices'
      responses:
        '200':
          description: The created price category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prices'
  /api/Prices/UpdatePrice:
    put:
      summary: Updates a price
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prices'
      responses:
        '200':
          description: The updated price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prices'
  /api/Stock/GetStocks:
    get:
      summary: Returns a list of stocks for a branch
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: A list of stocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stock'
  /api/Stock/NewStock:
    post:
      summary: Creates a new stock
      parameters:
        - in: query
          name: tankId
          schema:
            type: string
          required: true
          description: The ID of the tank
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stock'
      responses:
        '200':
          description: The created stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
  /api/Tanks/CreateTank:
    post:
      summary: Creates a new tank
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tank'
      responses:
        '200':
          description: The created tank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tank'
  /api/Tanks/GetTanks:
    get:
      summary: Returns a list of tanks for a given branch
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: The ID of the branch
      responses:
        '200':
          description: A list of tanks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tank'
  /api/Tanks/SwitchTank:
    post:
      summary: Switches the current tank for a branch
      parameters:
        - in: query
          name: branch
          schema:
            type: integer
          required: true
          description: The ID of the branch
        - in: query
          name: current
          schema:
            type: string
          required: true
          description: The ID of the new tank
        - in: query
          name: old
          schema:
            type: string
          required: true
          description: The ID of the old tank
        - in: query
          name: newname
          schema:
            type: string
          required: true
          description: The name of the new tank
      responses:
        '200':
          description: The updated branch
          content:
            application/json:
